# Base MMGIS stack for the Codespaces demo: the app, PostGIS and TiTiler.
# Derived from docker-compose.sample.yml with STAC / TiPG / TiTiler-pgSTAC /
# Veloserver omitted -- each one costs start-up time and memory against the
# visitor's quota. TiTiler stays because without it a single COG cannot be shown
# as a tile layer (WITH_TITILER in the generated env file).
#
# Credentials: nothing is written literally here. Every value is interpolated
# from the env file that .devcontainer/scripts/setup-env.sh generates, so there
# is one place to look and no "UPDATE ME" literal to forget. The `:?` form fails
# the `up` with a readable message rather than silently starting Postgres with
# an empty or default password.
#
# That env file lives OUTSIDE the repository ($MMGIS_ENV_FILE, by default
# $HOME/.mmgis-codespace/.env) so a generated demo credential can never be
# committed or copied into a Docker build context. Those credentials are
# throwaway, generated per codespace, and reach nothing outside this container
# network -- never reuse them anywhere real.
#
# TLS: none here on purpose. GitHub terminates TLS at the forwarded-port edge
# (https://<codespace>-8888.app.github.dev) and proxies plain HTTP to 8888, so
# MMGIS runs with HTTPS=false and no certificates.
#
# If a fork re-enables STAC / TiPG / TiTiler-pgSTAC, copy those services from
# docker-compose.sample.yml but interpolate ${DB_USER} / ${DB_PASS} into their
# POSTGRES_USER / POSTGRES_PASS instead of editing the sample's literals.
services:
  mmgis:
    image: ${MMGIS_IMAGE:-ghcr.io/nasa-ammos/mmgis:5.5.5}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file: ${MMGIS_ENV_FILE:?set by the devcontainer; see .devcontainer/scripts/setup-env.sh}
    ports:
      - 8888:8888
    healthcheck:
      test:
        ["CMD", "curl", "-XGET", "http://mmgis:8888/api/utils/healthcheck"]
      interval: 10s
      retries: 12
      start_period: 20s
      timeout: 8s
    restart: on-failure
    # Images since #1120 run as uid 10001, which cannot write the bind-mounted
    # ../Missions owned by the codespace user. start.sh sets MMGIS_USER to that
    # owner's numeric uid:gid for such images, and to root for older releases,
    # which were built to run as root. Root is also the fallback when compose is
    # run by hand, since it can always write the mount. group_add 0 lets an
    # arbitrary uid write the group-root parts of the image, as the Docker docs
    # for #1120 describe.
    user: ${MMGIS_USER:-0:0}
    group_add: ["0"]
    volumes:
      - ../Missions:/usr/src/app/Missions
      # Mounted rather than assumed present: the published image predates this
      # script, so the demo configuration would not otherwise have it.
      - ../scripts/seed-reference-mission.js:/usr/src/app/scripts/seed-reference-mission.js:ro

  # Same service as docker-compose.sample.yml, with two changes for the smallest
  # Codespaces machine (8 GB shared with mmgis and db): the sample's 8G memory
  # limit is 2G here, and GDAL_CACHEMAX is a fixed 512 MB rather than 75% of RAM.
  # MMGIS proxies /titiler to this service by name; nothing is published to the
  # host. It has no credentials and reads ../Missions read-only.
  titiler:
    # See https://github.com/developmentseed/titiler/discussions/387
    platform: linux/amd64
    image: ghcr.io/developmentseed/titiler:2.2.0
    restart: on-failure
    environment:
      - HOST=0.0.0.0
      - PORT=8883
      - WEB_CONCURRENCY=1
      - CPL_TMPDIR=/tmp
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.tiff
      - GDAL_CACHEMAX=512
      - GDAL_INGESTED_BYTES_AT_OPEN=32768
      - GDAL_DISABLE_READDIR_ON_OPEN=YES
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_VERSION=2
      - PYTHONWARNINGS=ignore
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=536870912
      - TILEMATRIXSET_DIRECTORY=/adjacent-servers/resources/tilematrixsets/planetcantile_v4
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ../Missions:/Missions:ro
      - ../adjacent-servers/resources:/adjacent-servers/resources:ro

  db:
    image: postgis/postgis:18-3.6-alpine
    env_file: ${MMGIS_ENV_FILE:?set by the devcontainer; see .devcontainer/scripts/setup-env.sh}
    environment:
      - POSTGRES_USER=${DB_USER:?missing -- run .devcontainer/scripts/setup-env.sh}
      - POSTGRES_PASSWORD=${DB_PASS:?missing -- run .devcontainer/scripts/setup-env.sh}
    shm_size: "512m"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U ${DB_USER:?}"]
      interval: 5s
      retries: 20
      start_period: 10s
      timeout: 5s
    restart: on-failure
    volumes:
      - mmgis-db:/var/lib/postgresql

volumes:
  mmgis-db:
