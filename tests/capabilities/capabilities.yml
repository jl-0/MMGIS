        description: Tabular datasets joined to layers by key.
        code:
          - plugins/core/backend/Datasets/**
        tests:
          - plugins/core/backend/Datasets/tests/*.spec.js
      - id: geodata.stac
        name: STAC catalogs
        description: STAC collections and items, served directly or as mosaics.
        code:
          - plugins/core/backend/Stac/**
          - adjacent-servers/stac/**
        tests:
          - plugins/core/backend/Stac/tests/*.spec.js
          - tests/unit/stac-url-transformation.spec.js
        scenarios:
          - Loading vector features from STAC Item
          - Browsing STAC Collection as vector features
          - STAC Collection as tile mosaic through TiTiler-PgSTAC
          - STAC search with spatial and temporal filters
      - id: geodata.tiles
        name: TiTiler, COGs & adjacent servers
        description: TiTiler tile serving, expression and URL validation, and the proxied adjacent servers.
        code:
          - adjacent-servers/**
        tests:
          - tests/e2e/api/titiler-planetcantile.spec.js
          - tests/e2e/api/adjacent-servers.spec.js
          - tests/unit/validateTitiler*.spec.js
          - tests/unit/proxyPath.spec.js
          - tests/unit/timeTilesParser.spec.js
        scenarios:
          - Serving basic COG through TiTiler
          - Transforming 32-bit COG with color scaling
          - Multi-band COG with custom band selection
          - COG with custom tile matrix set for non-Web Mercator projection
          - TiTiler error handling for invalid COG
      - id: geodata.imaging
        name: Image processing
        description: Server-side image handling with sharp.
        code: []
        tests:
          - tests/e2e/api/sharp-imaging.spec.js
          - tests/unit/sharp.spec.js

