# MMGIS capability registry — the source of truth for test traceability.
#
# Two levels: a top-level capability (e.g. `layers`) and its children
# (e.g. `layers.vector`). Every Playwright test belongs to exactly one capability:
#
#   1. An explicit tag on the test or its describe block wins: `{ tag: '@cap:layers.vector' }`
#      (use it when one spec file covers several capabilities).
#   2. Otherwise the spec file is matched against the `tests:` globs below.
#      An exact file path beats a glob; between globs, the first in file order wins.
#
# Fields
#   id           kebab-case, children are `<parent>.<child>`
#   name         human name used in the report
#   description  what the capability is, in user terms
#   status       active | planned | excluded (excluded needs `reason`)
#   code         globs of product code this capability owns — used for per-capability
#                coverage and for "changed code with no test change" PR findings
#   tests        globs of spec files that test it (see rule 2)
#   specs        related spec-kit folders in specs/
#   scenarios    behaviours that should be covered (seeded from the Gherkin
#                feature files on branch feature/bdd-gherkin-tests). The report lists
#                them under "Planned behaviours" until a test claims them with
#                `scenario('<text>')` (see tests/helpers/test.js).
#
# `npm run test:registry` validates this file against the real spec files.

capabilities:
  # ───────────────────────────────────────────────────────────────── access
  - id: access
    name: Authentication & Access Control
    description: >
      Signing in to MMGIS, sessions, accounts, and the permission model that decides
      who may see and change each mission (SITE_ACCESS, AUTH_PROVIDERS, roles, groups, tokens).
    specs: [specs/001-authentication-and-user-management]
    children:
      - id: access.login
        name: Login, signup & sessions
        description: Local login and signup flows, password management, session lifetime and guest access.
        code:
          - plugins/core/auth/Local/**
          - views/login*.pug
          - plugins/core/backend/Users/**
        tests:
          - tests/e2e/auth/login-flow.spec.js
          - tests/e2e/auth/signup-flow.spec.js
          - tests/e2e/auth/password-management.spec.js
          - tests/e2e/auth/session-management.spec.js
          - tests/e2e/auth/guest-access.spec.js
          - plugins/core/backend/Users/tests/*.spec.js
          - plugins/core/auth/Local/tests/*.spec.js
          - tests/e2e/security/local-provider-routes.spec.js
      - id: access.permissions
        name: Permissions & site access
        description: >
          Capability-based authorization (`s.authorize`), roles and scoped role bindings,
          SITE_ACCESS modes, setup codes and legacy permission import.
        code:
          - API/permissions/**
          - plugins/core/backend/Access/**
          - scripts/auth-migrate.js
        tests:
          - tests/unit/permissions-*.spec.js
          - tests/e2e/auth/authorization.spec.js
          - tests/e2e/auth/permission-matrix.spec.js
          - tests/e2e/security/missions-viewing.spec.js
          - tests/e2e/configure/configure-access.spec.js
      - id: access.providers
        name: Login providers (proxy, LDAP)
        description: >
          Login provider plugins other than Local: the reverse-proxy provider and its trust
          modes, and the LDAP provider.
        code:
          - plugins/core/auth/Proxy/**
          - plugins/core/auth/Ldap/**
        tests:
          - plugins/core/auth/Proxy/tests/*.spec.js
          - plugins/core/auth/Ldap/tests/*.spec.js
      - id: access.accounts
        name: Accounts & tokens
        description: Account administration and long-term API tokens.
        code:
          - plugins/core/backend/Accounts/**
          - plugins/core/backend/LongTermToken/**
        tests:
          - plugins/core/backend/Accounts/tests/*.spec.js
          - plugins/core/backend/LongTermToken/tests/*.spec.js
          - tests/unit/token-expiry-and-log-redaction.spec.js
      - id: access.connections
        name: Service connections
        description: Third-party service connections (e.g. Earthdata) that tools declare in plugin.json.
        code:
          - API/connections/**
          - src/essence/Basics/Connections_/**
          - plugins/core/connections/**
        tests:
          - tests/unit/connections.spec.js

  # ─────────────────────────────────────────────────────────────── security
  - id: security
    name: Security Hardening
    description: >
      Defences that apply across MMGIS: input validation, injection and traversal protection,
      safe headers, rate limiting, output sanitization.
    children:
      - id: security.injection
        name: SQL injection protection
        description: Parameterised queries and identifier sanitization for every user-supplied filter.
        code: [API/utils.js]
        tests:
          - tests/e2e/security/sql-injection.spec.js
          - tests/e2e/security/geodatasets-in-filter.spec.js
          - tests/e2e/api/filesutils-sql-injection.spec.js
          - tests/unit/sql-injection-prevention.spec.js
      - id: security.paths
        name: Path traversal & file access
        description: Mission paths, GDAL dataset paths and static file serving cannot escape their roots.
        code:
          - API/validateMissionsPath.js
          - API/validateGdalDatasetPath.js
        tests:
          - tests/e2e/security/path-traversal.spec.js
          - tests/e2e/security/gdal-dataset-path.spec.js
          - tests/unit/path-traversal-prevention.spec.js
          - tests/unit/validateGdalDatasetPath.spec.js
          - tests/unit/validateMissionsPath.spec.js
      - id: security.web
        name: Headers, auth bypass & web hardening
        description: Security headers, header injection, auth-bypass attempts, XSS and prototype pollution.
        code:
          - scripts/middleware.js
          - API/origin.js
        tests:
          - tests/e2e/security/headers.spec.js
          - tests/e2e/security/header-injection.spec.js
          - tests/e2e/security/auth-bypass.spec.js
          - tests/e2e/security/configure-export.spec.js
          - tests/unit/dom-xss-sanitization.spec.js
          - tests/unit/prototype-pollution.spec.js
          - tests/unit/security-fixes.spec.js
      - id: security.ratelimit
        name: Rate limiting
        description: Request rate limits on sensitive and expensive routes.
        code: [scripts/rateLimiters.js]
        tests:
          - tests/e2e/api/ratelimit.spec.js
          - tests/unit/rate-limiting.spec.js
      - id: security.logging
        name: Log sanitization
        description: Secrets and user input are redacted or neutralised before they reach the logs.
        code: [API/logger.js]
        tests:
          - tests/unit/logger-sanitization.spec.js

