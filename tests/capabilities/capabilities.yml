  - id: layers
    name: Layers & Layer Types
    description: >
      Loading and displaying data layers of every type, styling them, filtering them,
      and the layer-type plugin system that defines them.
    specs:
      - specs/007-layer-and-map-configuration
      - specs/009-data-formats-and-layer-types
    children:
      - id: layers.lifecycle
        name: Layer loading, toggling & refresh
        description: Acquiring, adding, toggling, reloading and refreshing layers; the layer tree.
        code:
          - src/essence/Basics/Layers_/Layers_.js
          - src/essence/Basics/Layers_/lifecycle/**
          - src/essence/Basics/Layers_/hierarchy/**
          - src/essence/Basics/Layers_/data/**
          - src/essence/Basics/Layers_/interface/**
        tests:
          - tests/e2e/map/layer-toggle.spec.js
          - tests/unit/layerAcquire.spec.js
          - tests/unit/layerInterface.spec.js
          - tests/unit/layerSource.spec.js
          - tests/unit/layerSurfaces.spec.js
          - tests/unit/layerToggleSubscriptions.spec.js
          - tests/unit/refreshAndAvailability.spec.js
        scenarios:
          - Toggling layer visibility
          - Adjusting layer opacity
          - Managing layer groups and hierarchy
      - id: layers.types
        name: Layer types
        description: >
          vector, tile, vectortile, data, model, image, velocity, video, header, query and
          3D tiles layers, defined as layer-type plugins.
        code:
          - plugins/core/layertypes/**
          - src/essence/Basics/Layers_/registry/**
          - src/essence/Basics/Layers_/render/**
        tests:
          - plugins/core/layertypes/**/tests/*.spec.js
          - tests/e2e/map/layer-types.spec.js
          - tests/e2e/map/kinds.spec.js
          - tests/unit/layerTypeBranchGuardrail.spec.js
          - tests/unit/layerTypeConfigValidation.spec.js
          - tests/unit/layerTypeInheritance.spec.js
          - tests/unit/updateLayerTypes.spec.js
        scenarios:
          - Loading and displaying raster layers
          - Displaying vector layer features
          - Cloud Optimized GeoTIFF (COG) layer performance
          - Streamlines visualization with wind data
          - Particle visualization with atmospheric data
          - Velocity layer data format support
      - id: layers.formats
        name: Data formats (KML, GeoJSON, …)
        description: Reading supported vector formats such as KML into layers.
        code: []
        tests:
          - tests/e2e/map/kml-layer.spec.js
          - tests/unit/kml-support.spec.js
          - tests/unit/turf.spec.js
      - id: layers.styling
        name: Styling & dynamic style
        description: Static and data-driven (dynamic) styles, gradients and legends derived from style.
        code:
          - src/essence/Basics/Layers_/display/**
          - src/essence/Basics/Layers_/legend/**
        tests:
          - tests/e2e/map/dynamic-style.spec.js
          - tests/unit/dynamicStyle*.spec.js
          - tests/unit/layerDynamicStyle.spec.js
          - tests/unit/gradientPolyline.spec.js
          - tests/unit/legendValueUnits.spec.js
        scenarios:
          - Velocity layer customization and styling
      - id: layers.filtering
        name: Layer filtering
        description: Filtering layer features by property and spatial extent.
        code:
          - src/essence/Basics/Layers_/Filtering/**
        tests:
          - tests/e2e/map/layer-filtering.spec.js
        scenarios:
          - Layer filtering functionality
      - id: layers.attachments
        name: Layer attachments
        description: Labels, bearings, image overlays, models, pairings, uncertainty ellipses and other attachments.
        code:
          - plugins/core/layerattachments/**
        tests:
          - tests/unit/defaultAttachments.spec.js
          - tests/unit/updateLayerAttachments.spec.js

